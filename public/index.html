<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bus Booking</title>
    <!-- Linking our external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚍 Bus Booking System</h1>
        <p>Book your next journey with ease!</p>
        
        <!-- The form sends data to our Java backend (/book URL) using the POST method -->
        <form action="/book" method="POST" id="bookingForm">
            
            <div class="input-group">
                <label for="passengerName">Full Name</label>
                <input type="text" id="passengerName" name="passengerName" placeholder="Enter your name" required>
            </div>
            
            <div class="input-group">
                <label for="destination">Destination</label>
                <select id="destination" name="destination" required>
                    <option value="">Select a city...</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Chennai">Chennai</option>
                </select>
            </div>

            <div class="input-group">
                <label for="date">Travel Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="input-group">
                <label>Select your Seat</label>
                <p style="font-size: 12px; margin-bottom: 5px;">Front of Bus</p>
                <div class="bus-layout" id="busLayout">
                    <!-- Seats will be generated by JavaScript -->
                </div>
                <!-- Hidden input to send the selected seat to Java backend -->
                <input type="hidden" id="selectedSeat" name="seatNumber" required>
            </div>

            <button type="submit" class="btn">Book Ticket 🎫</button>
        </form>

    </div>

    <!-- Linking our optional JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
